# Runs the tests on pull requests into main and on pushes to main.
#
# Excluded:
#   tests/test_metrics.py, tests/test_explainer.py - import the package
#     `aryaxai_xai_metrics_tabular`, which no longer exists (now `xai_evals`).
#
# Stubbed: `dl_backtrace` (the installed release has no `tf_backtrace` module
#   and its compiled CUDA extension fails to load against the pinned torch).
#   The tests do not use it, so an empty stand-in package is put on PYTHONPATH.
#
# Extra install: `cachetools` is needed by quantus but missing from
# requirements.txt, so it is installed here.
name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt pytest cachetools
          pip install -e . --no-deps
      - name: Stub dl_backtrace
        run: |
          mkdir -p "$RUNNER_TEMP/stubs/dl_backtrace"
          for m in tf_backtrace pytorch_backtrace; do
            mkdir -p "$RUNNER_TEMP/stubs/dl_backtrace/$m"
            echo "Backtrace = object" > "$RUNNER_TEMP/stubs/dl_backtrace/$m/__init__.py"
          done
          touch "$RUNNER_TEMP/stubs/dl_backtrace/__init__.py"
          echo "PYTHONPATH=$RUNNER_TEMP/stubs" >> "$GITHUB_ENV"
      - name: Test
        run: >
          pytest -q
          tests/test_image_metric_aggregation.py
          tests/test_tabular_metric_feature_order.py
          tests/test_tabular_infidelity.py
